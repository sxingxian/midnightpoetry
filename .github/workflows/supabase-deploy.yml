name: Deploy Supabase

# Applies new database migrations, without a computer (same as Zyra's workflow).
# From a phone: GitHub app → this repository → Actions → Deploy Supabase → Run workflow.
#
# Needs, under Settings → Secrets and variables → Actions:
#   secret   SUPABASE_ACCESS_TOKEN  (supabase.com → Account → Access Tokens)
#   variable SUPABASE_PROJECT_REF   (the studio project's id, e.g. abcdefghijklmnopqrst — not Zyra's or Zeno's)
# No database password is needed: without one, the Supabase CLI signs in to the database with a short-lived
# login role that it requests through the Management API using the access token.
# If a SUPABASE_DB_PASSWORD secret exists it is used instead.
# Optional: variable AUTO_DEPLOY_SUPABASE = true runs this automatically after CI passes on main.
#
# It refuses to deploy a commit whose CI run did not pass, so untested migrations never reach the database.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the migrations that would run (changes nothing)
        type: boolean
        default: false
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs always; automatic runs only when switched on and CI passed on a push to this repository's main
    # (never a pull request's run, and never a fork's).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_DEPLOY_SUPABASE == 'true' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Optional. Exported to the CLI only when set, so an empty value never counts as a password.
      DB_PASSWORD_OPTIONAL: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check settings
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -n "$PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Add these under Settings → Secrets and variables → Actions:$missing"
            exit 1
          fi

      - name: Make sure CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub can take a little while to list a run that has just finished, so ask a few times.
          for attempt in 1 2 3 4 5 6; do
            result=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed&per_page=1" --jq '.workflow_runs[0].conclusion // "none"' || echo "error")
            [ "$result" = "success" ] && break
            [ "$result" = "failure" ] || [ "$result" = "cancelled" ] && break
            sleep 15
          done
          if [ "$result" != "success" ]; then
            echo "::error::CI has not passed for ${SHA::7} (result: $result). Wait for CI to finish, or fix it, then run this again."
            exit 1
          fi
          echo "::notice::CI passed for ${SHA::7}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0

      - name: Link the project
        run: |
          if [ -n "$DB_PASSWORD_OPTIONAL" ]; then export SUPABASE_DB_PASSWORD="$DB_PASSWORD_OPTIONAL"; fi
          supabase link --project-ref "$PROJECT_REF"

      - name: Migrations that would run
        run: |
          if [ -n "$DB_PASSWORD_OPTIONAL" ]; then export SUPABASE_DB_PASSWORD="$DB_PASSWORD_OPTIONAL"; fi
          supabase db push --dry-run

      - name: Apply migrations
        if: env.DRY_RUN != 'true'
        run: |
          if [ -n "$DB_PASSWORD_OPTIONAL" ]; then export SUPABASE_DB_PASSWORD="$DB_PASSWORD_OPTIONAL"; fi
          supabase db push --yes

      - name: Summary
        if: always()
        run: |
          {
            echo "### Supabase deploy"
            echo "- Commit: \`${SHA::7}\`"
            echo "- Dry run: $DRY_RUN"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
